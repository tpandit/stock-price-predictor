[project]
name = "stock-trend-prediction"
version = "0.1.0"
description = "Stock Trend Prediction using MLflow on Databricks"
requires-python = ">=3.8"
dependencies = [
    "pyspark>=3.5.0",
    "delta-spark>=2.4.0",
    "mlflow>=2.8.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]



